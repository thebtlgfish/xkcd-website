<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random XKCD Comic</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f4f5f7;
            color: #333;
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .comic-card {
            background: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
            max-width: 700px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
        }
        .comic-meta {
            font-size: 0.85rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }
        h1 {
            font-size: 1.5rem;
            margin: 0 0 1.5rem 0;
            color: #111;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin: 1rem 0;
        }
        .comic-desc {
            font-size: 0.95rem;
            color: #555;
            font-style: italic;
            margin-top: 1.5rem;
            line-height: 1.5;
            padding: 0 1rem;
        }
        footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="comic-card">
        <div class="comic-meta">Comic #{{ comic_num }}</div>
        <h1>{{ title }}</h1>
        
        <img src="{{ img }}" alt="{{ title }}">
        
        <p class="comic-desc">{{ desc }}</p>
        <p class="comic-desc"> Comic <a href="{{ link }}" target="_blank"> {{ comic_num }}</a> </p>
    </div>
    
    <footer>All credit to <a href="https://xkcd.com" target="_blank"> XKCD </a> Webcomic</footer>
</body>
</html>
